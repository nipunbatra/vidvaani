[project]
name = "vidvaani"
version = "0.1.0"
description = "VidVaani: AI pipeline for dubbing YouTube videos into Hindi"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "yt-dlp>=2024.0.0",
    "mlx-whisper>=0.4.0",
    "google-genai>=1.0.0",
    "edge-tts>=6.1.0",
    "pydub>=0.25.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "gradio>=5.0.0",
]

[project.scripts]
vidvaani = "vidvaani.cli:main"
vidvaani-server = "vidvaani.server:main"
vidvaani-ui = "vidvaani.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
